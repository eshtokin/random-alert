apply plugin: 'com.android.application'

android {
    namespace 'com.pulse.alarms'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pulse.alarms'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
